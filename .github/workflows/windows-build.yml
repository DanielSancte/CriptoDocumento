name: Windows build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.12.2 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"
          architecture: x64

      - name: Build and verify distribution
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Upload ProtectorPDF folder
        uses: actions/upload-artifact@v4
        with:
          name: ProtectorPDF
          path: dist/ProtectorPDF
          if-no-files-found: error
